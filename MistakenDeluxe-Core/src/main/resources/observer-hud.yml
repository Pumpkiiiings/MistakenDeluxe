# observer-hud.yml
# Aquí puedes editar los componentes de la HUD que se muestran a los jugadores con el mod Observer.

global:
  components:
    title:
      type: TEXT
      alignment: BOTTOM_RIGHT
      text_alignment: RIGHT
      offset_x: -10
      offset_y: -60
      scale: 1.0
      content: "&#4EAAFF<bold>MISTAKEN"
    player_name:
      type: TEXT
      alignment: BOTTOM_RIGHT
      text_alignment: RIGHT
      offset_x: -10
      offset_y: -50
      scale: 1.0
      content: "<white>Jugando como <yellow>%player_name%"
    player_level:
      type: TEXT
      alignment: BOTTOM_RIGHT
      text_alignment: RIGHT
      offset_x: -10
      offset_y: -40
      scale: 1.0
      content: "<white>Nivel: %mistakenlevel_level_prefix%</white>"
    id:
      type: TEXT
      alignment: BOTTOM_RIGHT
      text_alignment: RIGHT
      offset_x: -10
      offset_y: -30
      scale: 1.0
      content: "<white>Id: <gray>%mistaken_session_id%</white>"
    modo:
      type: TEXT
      alignment: BOTTOM_RIGHT
      text_alignment: RIGHT
      offset_x: -10
      offset_y: -20
      scale: 1.0
      content: "<white>Modo: <green>%mistaken_mode%</white>"
    dinero:
      type: TEXT
      alignment: BOTTOM_RIGHT
      text_alignment: RIGHT
      offset_x: -10
      offset_y: -10
      scale: 1.0
      content: "<white>Dinero: <gold>$%vault_eco_balance%</gold></white>"

prelobby:
  components:
    vote_maps:
      type: TEXT
      alignment: MIDDLE_LEFT
      text_alignment: LEFT
      offset_x: 20
      offset_y: -40
      scale: 1.0
      content: "<gold><bold>Votación</bold></gold>\n<gray>Usa /votar para elegir el mapa.</gray>\n\n<white>%mistaken_votes%</white>"

ingame:
  components:
    timer_icon:
      type: ITEM
      material: "minecraft:clock"
      alignment: TOP_CENTER
      text_alignment: LEFT
      offset_x: -112
      offset_y: 5
      scale: 1.0
      amount: 1
    timer_text:
      type: TEXT
      alignment: TOP_CENTER
      text_alignment: LEFT
      offset_x: -100
      offset_y: 9
      scale: 1.0
      content: "<white>Tiempo: <yellow>%mistaken_timer%</yellow></white>"
    player_icon:
      type: ITEM
      material: "minecraft:player_head"
      alignment: TOP_CENTER
      text_alignment: LEFT
      offset_x: -12
      offset_y: 5
      scale: 1.0
      amount: 1
    player_text:
      type: TEXT
      alignment: TOP_CENTER
      text_alignment: LEFT
      offset_x: 0
      offset_y: 9
      scale: 1.0
      content: "<white>Vivos: <green>%mistaken_vivos%</green></white>"
    gens_icon:
      type: ITEM
      material: "minecraft:redstone_torch"
      alignment: TOP_CENTER
      text_alignment: LEFT
      offset_x: 88
      offset_y: 5
      scale: 1.0
      amount: 1
    gens_text:
      type: TEXT
      alignment: TOP_CENTER
      text_alignment: LEFT
      offset_x: 100
      offset_y: 9
      scale: 1.0
      content: "<white>Gens: <red>%mistaken_gens_reparados%</red>/<red>%mistaken_gens_total%</red></white>"

roles:
  survivor:
    components:
      title:
        type: TEXT
        alignment: TOP_LEFT
        text_alignment: LEFT
        offset_x: 10
        offset_y: 10
        scale: 2
        content: "<green><bold>SUPERVIVIENTE</bold></green>"
      desc:
        type: TEXT
        alignment: TOP_LEFT
        text_alignment: LEFT
        offset_x: 10
        offset_y: 35
        scale: 1.0
        content: "<white>Trabaja en equipo, repara los</white>"
      desc2:
        type: TEXT
        alignment: TOP_LEFT
        text_alignment: LEFT
        offset_x: 10
        offset_y: 45
        scale: 1.0
        content: "<white>generadores y escapa con vida.</white>"
  killer:
    components:
      title:
        type: TEXT
        alignment: TOP_LEFT
        text_alignment: LEFT
        offset_x: 10
        offset_y: 10
        scale: 2
        content: "<red><bold>ASESINO</bold></red>"
      desc:
        type: TEXT
        alignment: TOP_LEFT
        text_alignment: LEFT
        offset_x: 10
        offset_y: 35
        scale: 1.0
        content: "<white>Caza a los supervivientes y evita</white>"
      desc2:
        type: TEXT
        alignment: TOP_LEFT
        text_alignment: LEFT
        offset_x: 10
        offset_y: 45
        scale: 1.0
        content: "<white>que reparen los generadores.</white>"
