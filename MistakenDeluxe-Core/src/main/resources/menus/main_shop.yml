# ==========================================
# Mistaken - Main Shop Selector (GLOBAL)
# ==========================================
# título resuelto desde messages.yml: menus.tienda_principal.titulo

title: "%menu_title%"
rows: 3

settings:
  click-sound: "BLOCK_NOTE_BLOCK_XYLOPHONE"

overlay:
  - "#########"
  - "#X  S  X#"
  - "#########"

overlay_items:
  '#':
    material: "GRAY_STAINED_GLASS_PANE"
    name: " "
  'X':
    material: "BLACK_STAINED_GLASS_PANE"
    name: " "

# Items con funcionalidad (texto del item se lee desde messages.yml: menus.tienda_principal.items.*)
items:
  asesinos:
    slot: 11
    material: "NETHERITE_SWORD"
    name_key: "menus.tienda_principal.items.asesinos.nombre"
    lore_key: "menus.tienda_principal.items.asesinos.lore"
  supervivientes:
    slot: 15
    material: "IRON_CHESTPLATE"
    name_key: "menus.tienda_principal.items.supervivientes.nombre"
    lore_key: "menus.tienda_principal.items.supervivientes.lore"
