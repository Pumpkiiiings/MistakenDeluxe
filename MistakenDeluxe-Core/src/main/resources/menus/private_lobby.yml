menus:
  private_lobby:
    title: "<dark_gray>Private Game Setup"
    rows: 5
    overlay:
      - "#########"
      - "#########"
      - "##     ##"
      - "#########"
      - "#########"
    overlay_items:
      '#':
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
    slots:
      start: 22
      rules: 20
      players: 21
      map: 23
      mode: 24
    items:
      start:
        name: "<green><bold>Start Game"
        lore:
          - "<gray>Force start the game."
      rules:
        name: "<gold><bold>Game Rules"
        lore:
          - "<gray>Modify game rules."
      map:
        name: "<gold><bold>Map Selector"
        lore:
          - "<gray>Choose the map to play."
      mode:
        name: "<gold><bold>Mode Selector"
        lore:
          - "<gray>Choose the game mode."
      players:
        name: "<gold><bold>Player Selector"
        lore:
          - "<gray>Choose player roles."
      back:
        name: "<red>Back"

  map_selector:
    title: "<dark_gray>Select Map"
    rows: 5
    overlay:
      - "#########"
      - "#       #"
      - "#       #"
      - "#       #"
      - "#### ####"
    overlay_items:
      '#':
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
    start_slot: 19
    max_slots: 34
    back_slot: 40
    items:
      map:
        lore_id: "<gray>ID: {map}"
        lore_click: "<e>Click to select"

  mode_selector:
    title: "<dark_gray>Select Mode"
    rows: 5
    overlay:
      - "#########"
      - "#########"
      - "##     ##"
      - "#########"
      - "#### ####"
    overlay_items:
      '#':
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
    start_slot: 20
    max_slots: 24
    back_slot: 40
    items:
      mode:
        lore_click: "<e>Click to select"

  player_selector:
    title: "<dark_gray>Selector de Jugadores"
    rows: 5
    overlay:
      - "#########"
      - "#       #"
      - "#       #"
      - "#       #"
      - "###   ###"
    overlay_items:
      '#':
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
    start_slot: 19
    max_slots: 34
    back_slot: 40
    next_slot: 41
    prev_slot: 39
    items:
      player:
        lore_role: "<gray>Role: {role}"
        lore_left: "<e>Left Click: Toggle Killer"
        lore_right: "<e>Right Click: Toggle Survivor"
        roles:
          random: "<gray>Random"
          killer: "<red><bold>Killer"
          survivor: "<green><bold>Survivor"

  rule_editor:
    title: "<dark_gray>Rule Editor"
    rows: 5
    overlay:
      - "#########"
      - "#       #"
      - "#       #"
      - "#########"
      - "#### ####"
    overlay_items:
      '#':
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
    slots:
      glowing: 19
      heartbeats: 20
      speed: 21
      jump: 22
      blindness: 23
      khealth: 24
      shealth: 25
      duration: 26
      characters: 27
      back: 40
    items:
      glowing:
        name: "<gold><bold>Constant Glowing"
        lore_state: "<gray>State: {color}{state}"
      heartbeats:
        name: "<gold><bold>Heartbeats"
        lore_state: "<gray>State: {color}{state}"
      speed:
        name: "<gold><bold>Base Speed"
        lore_level: "<gray>Level: <yellow>{level}"
      jump:
        name: "<gold><bold>Base Jump"
        lore_level: "<gray>Level: <yellow>{level}"
      blindness:
        name: "<gold><bold>Permanent Blindness"
        lore_role: "<gray>Applies to: <yellow>{role}"
      khealth:
        name: "<gold><bold>Killer Health"
        lore_hearts: "<gray>Hearts: <red>{hearts}"
      shealth:
        name: "<gold><bold>Survivor Health"
        lore_hearts: "<gray>Hearts: <red>{hearts}"
      duration:
        name: "<gold><bold>Game Duration"
        lore_time: "<gray>Time: <yellow>{time}"
      characters:
        name: "<gold><bold>Allowed Classes"
        lore:
          - "<gray>Select which killers and"
          - "<gray>survivors can be used."

  character_selector:
    title: "<dark_gray>Allowed Classes"
    rows: 6
    overlay:
      - "#########"
      - "#       #"
      - "#       #"
      - "#       #"
      - "#       #"
      - "#### ####"
    overlay_items:
      '#':
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
    start_slot: 10
    max_slots: 43
    back_slot: 49
    items:
      character:
        lore_state: "<gray>State: {color}{state}"
        lore_click: "<e>Click to toggle"
        states:
          enabled: "<green>Allowed"
          disabled: "<red>Blocked"
