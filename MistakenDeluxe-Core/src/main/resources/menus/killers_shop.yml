# ==========================================
# Mistaken - Assassin Shop (GLOBAL)
# ==========================================
# Este archivo es ÚNICO para todos los idiomas.
# El título se lee desde messages.yml del jugador via la clave:
#   menus.killers_shop.titulo
#
# Si quieres el título en inglés para jugadores con lang=en,
# ponlo en langs/en/messages.yml bajo menus.killers_shop.titulo

title: "%menu_title%"
rows: 6

settings:
  click-sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
  # Slots donde se colocan los asesinos dinámicamente
  available-slots: [19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]

  # Slots fijos para asesinos específicos (por su ID de clase)
  fixed-slots:
    pizzano: 38
    romeodebuff: 39

  # Botón para volver al menú principal
  back-button:
    material: "ARROW"
    slot: 49
    name: "<red><b>Volver</b>"

# Decoraciones de la GUI (compartidas para todos los idiomas)
overlay:
  - "#########"
  - "#R     R#"
  - "#       #"
  - "#       #"
  - "#R     R#"
  - "#### ####"

overlay_items:
  '#':
    material: "GRAY_STAINED_GLASS_PANE"
    name: " "
  'R':
    material: "RED_STAINED_GLASS_PANE"
    name: "<red><b>? ASSASSIN SECTION</b>"

# Nota: Los items de los asesinos NO se ponen aquí porque
# el plugin los genera desde killers_info.yml + messages.yml del jugador.
